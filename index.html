async function upv(f){const id=Date.now(),p='vid/'+id+'.'+((f.name.split('.').pop()||'mp4').toLowerCase());

const o={u:SB.storage.from('media').getPublicUrl(p).data.publicUrl,th:'',v:false};
try{const vd=document.createElement('video');vd.muted=true;vd.playsInline=true;vd.preload='auto';vd.src=URL.createObjectURL(f);
await new Promise((ok,no)=>{vd.onloadeddata=ok;vd.onerror=no});o.v=vd.videoHeight>vd.videoWidth;
vd.currentTime=Math.min(1,(vd.duration||2)/3);await new Promise(ok=>{vd.onseeked=ok;setTimeout(ok,1500)});
const c=document.createElement('canvas'),k=Math.min(1,720/Math.max(vd.videoWidth,vd.videoHeight));c.width=vd.videoWidth*k;c.height=vd.videoHeight*k;c.getContext('2d').drawImage(vd,0,0,c.width,c.height);
