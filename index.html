<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>منشئ موقع المونتاج</title>
<style>
:root{--bg:#fff;--fg:#111;--card:#f4f4f5;--bd:#e4e4e7;--mut:#71717a;--pri:#e11d2e;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b0b0d;--fg:#f4f4f5;--card:#131318;--bd:#26262d;--mut:#8b8b96}}
:root[data-theme="dark"]{--bg:#0b0b0d;--fg:#f4f4f5;--card:#131318;--bd:#26262d;--mut:#8b8b96}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;line-height:1.6}
button,input,textarea{font:inherit;color:inherit}
.wrap{max-width:680px;margin:0 auto;padding:16px}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:12px}
.top h1{font-size:20px;margin:0}
.btn{background:var(--pri);color:#fff;border:0;border-radius:10px;padding:10px 16px;cursor:pointer;font-weight:600}
.btn.g{background:var(--card);color:var(--fg);border:1px solid var(--bd)}
.sec{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:16px;margin-bottom:14px}
.sec h2{font-size:16px;margin:0 0 4px;display:flex;gap:8px;align-items:center}
.sec h2 i{font-style:normal;background:var(--bd);border-radius:6px;font-size:12px;padding:1px 7px;color:var(--mut)}
.sec p{color:var(--mut);font-size:13px;margin:0 0 10px}
label{display:block;font-size:13px;font-weight:600;margin:10px 0 4px}
input[type=text],input[type=url],textarea{width:100%;background:var(--bg);border:1px solid var(--bd);border-radius:10px;padding:10px 12px}
textarea{min-height:80px;resize:vertical}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.seg{display:inline-flex;border:1px solid var(--bd);border-radius:10px;overflow:hidden}
.seg button{background:var(--bg);border:0;padding:8px 16px;cursor:pointer}
.seg button.on{background:var(--pri);color:#fff}
.sw{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0}
.sw button{width:34px;height:34px;border-radius:9px;border:2px solid transparent;cursor:pointer}
.sw button.on{border-color:var(--fg)}
.item{display:grid;grid-template-columns:1fr 1fr auto;gap:8px;margin-bottom:8px}
.item.t{grid-template-columns:1fr 1fr auto}
.x{background:var(--bg);border:1px solid var(--bd);border-radius:10px;width:38px;cursor:pointer}
.add{width:100%;background:var(--bg);border:1px dashed var(--bd);border-radius:10px;padding:10px;cursor:pointer;color:var(--mut)}
.ph{display:flex;gap:12px;align-items:center}
.ph .im{width:72px;height:72px;border-radius:14px;background:var(--bg);border:1px solid var(--bd);background-size:cover;background-position:center}
.chk{display:flex;gap:8px;align-items:center;margin-top:10px;font-size:14px}
/* site */
#site{display:none}
.site{--sbg:#0b0b0d;--sfg:#f4f4f5;--sc:#141418;--sb:#26262d;--sm:#9b9ba6;background:var(--sbg);color:var(--sfg);min-height:100vh}
.site[data-t="light"]{--sbg:#fff;--sfg:#111;--sc:#f4f4f5;--sb:#e4e4e7;--sm:#666}
.site .in{max-width:1000px;margin:0 auto;padding:0 20px}
.site nav{display:flex;justify-content:space-between;align-items:center;padding:16px 20px;max-width:1000px;margin:0 auto}
.site nav b{font-size:15px}
.site nav a{color:var(--sm);text-decoration:none;font-size:13px;margin-inline-start:14px}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:#000c;color:#fff;padding:8px 14px;display:flex;justify-content:space-between;align-items:center;backdrop-filter:blur(8px)}
.grad{background:linear-gradient(135deg,var(--c1),var(--c2))}
.gt{background:linear-gradient(135deg,var(--c1),var(--c2));-webkit-background-clip:text;background-clip:text;color:transparent}
.hero{display:grid;grid-template-columns:1.2fr 1fr;gap:30px;align-items:center;padding:40px 0}
.hero h1{font-size:clamp(34px,7vw,64px);line-height:1.1;margin:10px 0}
.hero p{color:var(--sm);max-width:480px}
.av{display:inline-block;font-size:12px;border:1px solid var(--sb);border-radius:99px;padding:3px 12px;color:var(--sm)}
.av:before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:#22c55e;margin-inline-end:6px}
.pic{aspect-ratio:4/5;border-radius:22px;background:var(--sc) center/cover;padding:3px;border:3px solid var(--c1);box-shadow:0 0 50px color-mix(in srgb,var(--c1) 40%,transparent)}
.sb{display:inline-block;padding:11px 20px;border-radius:99px;font-weight:600;text-decoration:none;font-size:14px;margin:6px 6px 0 0;margin-inline:0 8px}
.sb.p{background:var(--sfg);color:var(--sbg)}.sb.o{border:1px solid var(--sb);color:var(--sfg)}
.sk{display:flex;gap:26px;flex-wrap:wrap;border-block:1px solid var(--sb);padding:18px 20px;justify-content:center;color:var(--sm);font-size:15px}
.sk span:before{content:"+";color:var(--c1);margin-inline-end:26px}.sk span:first-child:before{content:none}
.sc{padding:60px 0 10px}.sc small{color:var(--c1);letter-spacing:.15em;font-size:11px;font-weight:700}
.sc h2{font-size:clamp(26px,5vw,40px);margin:4px 0 20px}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.v{display:flex;flex-direction:column;justify-content:flex-end;aspect-ratio:16/9;border-radius:14px;padding:14px;text-decoration:none;color:#fff;position:relative;overflow:hidden;background:linear-gradient(160deg,#1c1c22,#0b0b0d)}
.v.s{aspect-ratio:9/16}
.v:before{content:"";position:absolute;inset:0;background:linear-gradient(135deg,var(--c1),var(--c2));opacity:.22}
.v i{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:46px;height:46px;border-radius:50%;background:#fff;color:#000;display:grid;place-items:center;font-style:normal}
.v span{position:relative;font-weight:600;font-size:14px}
.st{background:var(--sc);border:1px solid var(--sb);border-radius:14px;padding:20px}
.st b{font-size:34px;display:block}.st span{color:var(--sm);font-size:13px}
.tm{background:var(--sc);border:1px solid var(--sb);border-radius:14px;padding:18px}
.tm p{margin:0 0 12px}.tm a{color:var(--c1);font-size:13px;text-decoration:none}
.about{display:grid;grid-template-columns:1fr 1fr;gap:30px;align-items:center}
.cta{margin:60px 0 40px;border-radius:24px;padding:50px 24px;text-align:center;color:#fff}
.cta h2{font-size:clamp(26px,5vw,44px);margin:0 0 8px}
.cta .sb.p{background:#000;color:#fff}.cta .sb.o{border-color:#fff8;color:#fff}
.ft{text-align:center;color:var(--sm);font-size:12px;padding:20px}
#md{display:none;position:fixed;inset:0;background:#000d;z-index:50;align-items:center;justify-content:center;padding:16px}
.mb{width:min(900px,100%);position:relative}
.mx{position:absolute;top:-42px;inset-inline-end:0;background:#fff;color:#000;border:0;border-radius:50%;width:34px;height:34px;cursor:pointer}
.mv{aspect-ratio:16/9;background:#000;border-radius:12px;overflow:hidden;display:grid;place-items:center}
.mv.s{height:76vh;aspect-ratio:9/16;max-width:100%;margin:0 auto}
.mv iframe{width:100%;height:100%;border:0}
.mo{display:block;text-align:center;color:#fff;margin-top:10px;font-size:13px}
.v{background-size:cover;background-position:center}.v:after{content:"";position:absolute;inset:0;background:linear-gradient(transparent 45%,#000b)}.v i,.v span{z-index:1}
html{scroll-behavior:smooth}
.rv{opacity:0;transform:translateY(30px);transition:opacity .8s ease,transform .8s cubic-bezier(.2,.7,.2,1)}
.rv.in{opacity:1;transform:none}
.site nav{animation:nd .7s both}
@keyframes nd{from{opacity:0;transform:translateY(-14px)}}
.hero .pic{animation:fl 6s ease-in-out infinite,gl 4s ease-in-out infinite}
@keyframes fl{50%{translate:0 -12px}}
@keyframes gl{50%{box-shadow:0 0 90px color-mix(in srgb,var(--c1) 55%,transparent)}}
.hero h1{background-size:200% 100%}
.cta.grad{background-size:200% 200%;animation:gs 9s ease infinite}
@keyframes gs{50%{background-position:100% 50%}}
.gt{background-size:200% 100%;animation:gs 6s ease infinite}
.site .sk{overflow:hidden;flex-wrap:nowrap;justify-content:flex-start;padding:18px 0;direction:ltr}
.mqw{display:flex;width:max-content;animation:mq 28s linear infinite}
.mq{display:flex;gap:26px;padding-inline-end:26px;flex:none}.mq span{white-space:nowrap}
.sk .mq span:first-child:before{content:"+"}
.sk:hover .mqw{animation-play-state:paused}
@keyframes mq{to{transform:translateX(-50%)}}
.v,.st,.tm,.sb{transition:transform .3s cubic-bezier(.2,.7,.2,1),box-shadow .3s,filter .3s}
.v i{transition:transform .3s}
.site .v:hover{transform:translateY(-6px) scale(1.02);box-shadow:0 18px 40px #0008}
.site .v:hover i{transform:translate(-50%,-50%) scale(1.18)}
.site .st:hover,.site .tm:hover{transform:translateY(-5px);box-shadow:0 14px 34px #0005}
.site .sb:hover{transform:translateY(-3px);filter:brightness(1.1)}
.v i{animation:pp 2.4s ease-in-out infinite}
@keyframes pp{50%{box-shadow:0 0 0 12px #fff3}}
#md[style*="flex"]{animation:fi .25s}
#md[style*="flex"] .mb{animation:pop .3s cubic-bezier(.2,.7,.2,1)}
@keyframes fi{from{opacity:0}}
@keyframes pop{from{opacity:0;transform:scale(.9)}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important;scroll-behavior:auto!important}.rv{opacity:1!important;transform:none!important}}
@media(max-width:640px){.hero,.about{grid-template-columns:1fr}.g3{grid-template-columns:1fr 1fr}.g4{grid-template-columns:1fr 1fr}.item{grid-template-columns:1fr}.row{grid-template-columns:1fr}}
</style></head>
<body>
<div id="app" style="display:none"><div class="wrap" id="form"></div></div>
<div id="site"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
const D={lang:'ar',theme:'dark',c1:'#e11d2e',c2:'#ff7a2f',name:'',role:'',head:'',bio:'',skills:'',avail:true,photo:'',about:'',years:'',cta:'',ctasub:'',upwork:'',wa:'',email:'',ig:'',yt:'',tt:'',li:'',stats:[],long:[],short:[],tests:[]};
const COLS=[['#e11d2e','#ff7a2f'],['#e11d2e','#ffffff'],['#3b82f6','#8b5cf6'],['#22c55e','#06b6d4'],['#ec4899','#f59e0b'],['#f59e0b','#ef4444'],['#ffffff','#9ca3af']];
const T={ar:{work:'أعمالي',res:'النتائج',tm:'آراء العملاء',about:'عني',sel:'أعمال مختارة',long:'فيديوهات طويلة',short:'فيديوهات قصيرة',see:'شوف أعمالي',rev:'آراء العملاء',avail:'متاح لمشاريع جديدة',aboutT:'مونتير ثابت وطويل المدى',yrs:'سنين خبرة',hire:'اشتغل معايا',watch:'شاهد',proof:'أرقام حقيقية',back:'رجوع للوحة التحكم'},
en:{work:'Work',res:'Results',tm:'Testimonials',about:'About',sel:'Selected work',long:'Long-form',short:'Short-form',see:'See my work',rev:'Client reviews',avail:'Available for new projects',aboutT:'Your loyal, long-term editing partner',yrs:'years of experience',hire:'Hire me',watch:'Watch',proof:'Real results',back:'Back to dashboard'}};
let S;try{S=Object.assign({},D,JSON.parse(localStorage.getItem('pf')||'{}'))}catch(e){S={...D}}
const save=()=>{try{localStorage.setItem('pf',JSON.stringify(S))}catch(e){}};
const esc=s=>String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const $=id=>document.getElementById(id);
const fld=(k,l,ph,t='text')=>`<label>${l}</label><input type="${t}" data-k="${k}" value="${esc(S[k])}" placeholder="${ph||''}">`;
const area=(k,l,ph)=>`<label>${l}</label><textarea data-k="${k}" placeholder="${ph||''}">${esc(S[k])}</textarea>`;
const list=(k,rows)=>S[k].map((it,i)=>`<div class="item">${rows.map(([f,ph])=>`<input type="text" data-l="${k}" data-i="${i}" data-f="${f}" value="${esc(it[f])}" placeholder="${ph}">`).join('')}<button class="x" data-del="${k}:${i}">✕</button></div>`).join('')+`<button class="add" data-add="${k}">+ إضافة</button>`;
function form(){
$('form').innerHTML=`<div class="top"><h1>لوحة تحكم الموقع</h1><button class="btn" id="prev">معاينة الموقع ←</button></div>
<div class="sec"><h2><i>1</i>الشكل والألوان</h2><label>لغة الموقع</label><div class="seg">${['ar','en'].map(l=>`<button data-set="lang:${l}" class="${S.lang==l?'on':''}">${l=='ar'?'العربي':'English'}</button>`).join('')}</div>
<label>الخلفية</label><div class="seg">${['dark','light'].map(l=>`<button data-set="theme:${l}" class="${S.theme==l?'on':''}">${l=='dark'?'غامق':'فاتح'}</button>`).join('')}</div>
<label>الألوان (تدرّج)</label><div class="sw">${COLS.map((c,i)=>`<button data-col="${i}" class="${S.c1==c[0]&&S.c2==c[1]?'on':''}" style="background:linear-gradient(135deg,${c[0]},${c[1]})"></button>`).join('')}</div></div>
<div class="sec"><h2><i>2</i>بياناتك</h2><div class="ph"><div class="im" id="im" style="background-image:url('${S.photo}')"></div><div><button class="btn g" id="up">رفع صورة</button> <button class="btn g" id="rm">مسح</button><input type="file" id="file" accept="image/*" hidden></div></div>
<div class="row">${fld('name','اسمك','Ahmed Ali')}${fld('role','لقبك','Video Editor')}</div>
${fld('head','جملة رئيسية كبيرة','Edits that make your vision come alive')}
${area('bio','وصف سريع عنك وبتعمل إيه','أنا أحمد، مونتير فيديو لصناع المحتوى...')}
${fld('skills','مهاراتك (افصل بينهم بفاصلة)','YouTube long-form, Shorts, Motion graphics')}
<label class="chk"><input type="checkbox" data-k="avail" ${S.avail?'checked':''}> اظهر علامة "متاح لمشاريع جديدة"</label></div>
<div class="sec"><h2><i>3</i>أرقامك ونتايجك</h2><p>زي: 2M+ مشاهدات | الرقم وتحته وصفه.</p>${list('stats',[['n','2M+'],['l','مشاهدات على الشورتس']])}</div>
<div class="sec"><h2><i>4</i>فيديوهات لونج فورم</h2><p>لينك يوتيوب أو درايف + عنوان.</p>${list('long',[['u','https://youtu.be/...'],['t','العنوان']])}</div>
<div class="sec"><h2><i>5</i>فيديوهات شورت فورم</h2><p>شورتس، تيك توك، ريلز.</p>${list('short',[['u','https://...'],['t','العنوان']])}</div>
<div class="sec"><h2><i>6</i>آراء العملاء</h2><p>اسم العميل + رأيه + لينك الفيديو (اختياري).</p>${list('tests',[['n','اسم العميل'],['t','رأيه'],['u','لينك (اختياري)']])}</div>
<div class="sec"><h2><i>7</i>نبذة عنك</h2>${fld('years','سنين الخبرة','5')}${fld('aboutT','عنوان القسم (اختياري)','')}${area('about','نبذة','I have been editing videos for over 5 years...')}</div>
<div class="sec"><h2><i>8</i>التواصل</h2>${fld('cta','عنوان آخر جزء','Let’s make something people can’t stop watching')}${fld('ctasub','جملة تحته','')}
<div class="row">${fld('upwork','Upwork','https://www.upwork.com/freelancers/...')}${fld('wa','واتساب (بكود الدولة)','201001234567')}${fld('email','الإيميل','')}${fld('ig','انستجرام','')}${fld('yt','يوتيوب','')}${fld('tt','تيك توك','')}${fld('li','لينكدإن','')}</div></div>
<button class="btn" style="width:100%;margin-bottom:30px" id="prev2">معاينة الموقع ←</button>`;}
function ev(e){const d=e.target.dataset;if(d.k){S[d.k]=e.target.type=='checkbox'?e.target.checked:e.target.value}else if(d.l){S[d.l][d.i][d.f]=e.target.value}save()}
document.addEventListener('input',ev);document.addEventListener('change',ev);
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const d=b.dataset;
if(d.set){const[k,v]=d.set.split(':');S[k]=v;save();form()}
else if(d.col){[S.c1,S.c2]=COLS[d.col];save();form()}
else if(d.add){const m={stats:{n:'',l:''},long:{u:'',t:''},short:{u:'',t:''},tests:{n:'',t:'',u:''}};S[d.add].push(m[d.add]);save();form()}
else if(d.del){const[k,i]=d.del.split(':');S[k].splice(i,1);save();form()}
else if(b.id=='up')$('file').click();
else if(b.id=='rm'){S.photo='';save();form()}
else if(b.id=='prev'||b.id=='prev2'){show(true)}
else if(b.id=='back'){show(false)}});
document.addEventListener('change',e=>{if(e.target.id!='file')return;const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const c=document.createElement('canvas'),s=Math.min(1,700/im.width);c.width=im.width*s;c.height=im.height*s;c.getContext('2d').drawImage(im,0,0,c.width,c.height);S.photo=c.toDataURL('image/jpeg',.82);save();form()};im.src=r.result};r.readAsDataURL(f)});
const lk=(u,t,c='')=>u?`<a class="sb ${c}" href="${esc(u)}" target="_blank" rel="noopener">${t}</a>`:'';
function thumb(u){u=u||'';let m;
if(m=u.match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?v=|shorts\/|embed\/))([\w-]{6,})/))return'https://img.youtube.com/vi/'+m[1]+'/hqdefault.jpg';
if(m=u.match(/drive\.google\.com\/file\/d\/([\w-]+)/))return'https://drive.google.com/thumbnail?id='+m[1]+'&sz=w640';
if(m=u.match(/vimeo\.com\/(\d+)/))return'https://vumbnail.com/'+m[1]+'.jpg';
return''}
function site(){const L=T[S.lang],dir=S.lang=='ar'?'rtl':'ltr';
const sk=S.skills.split(',').map(s=>s.trim()).filter(Boolean);
const vids=(a,c)=>a.filter(v=>v.u||v.t).map(v=>`<a class="v ${c}" ${thumb(v.u)?`style="background-image:url('${thumb(v.u)}')"`:''} data-play="${esc(v.u)}" href="${esc(v.u)||'#'}" target="_blank" rel="noopener"><i>▶</i><span>${esc(v.t)}</span></a>`).join('');
const soc=[['ig','Instagram'],['yt','YouTube'],['tt','TikTok'],['li','LinkedIn']].map(([k,n])=>lk(S[k],n,'o')).join('');
const main=S.upwork?lk(S.upwork,L.hire+' →','p'):S.wa?lk('https://wa.me/'+S.wa.replace(/\D/g,''),L.hire+' →','p'):lk(S.email&&'mailto:'+S.email,L.hire+' →','p');
return `<div class="site" dir="${dir}" data-t="${S.theme}" style="--c1:${S.c1};--c2:${S.c2}">

<nav><b>${esc(S.name)}</b><div><a href="#w">${L.work}</a><a href="#r">${L.res}</a><a href="#t">${L.tm}</a><a href="#a">${L.about}</a></div></nav>
<div class="in"><div class="hero"><div>${S.avail?`<span class="av">${L.avail}</span>`:''}<h1>${esc(S.head)||esc(S.role)}</h1><p>${esc(S.bio)}</p>${lk('#w'.replace('#w','')||'','')}<a class="sb p" href="#w">${L.see}</a><a class="sb o" href="#t">${L.rev}</a></div>
<div class="pic" style="background-image:url('${S.photo}')"></div></div></div>
${sk.length?`<div class="sk">${sk.map(s=>`<span>${esc(s)}</span>`).join('')}</div>`:''}
<div class="in">
${S.long.length||S.short.length?`<div class="sc" id="w"><small>${L.sel.toUpperCase()}</small><h2>${L.work}</h2>${S.long.length?`<div class="g3">${vids(S.long,'')}</div>`:''}${S.short.length?`<h3 style="margin:26px 0 12px">${L.short}</h3><div class="g4">${vids(S.short,'s')}</div>`:''}</div>`:''}
${S.stats.length?`<div class="sc" id="r"><small>${L.res.toUpperCase()}</small><h2>${L.proof}</h2><div class="g4">${S.stats.map(s=>`<div class="st"><b class="gt">${esc(s.n)}</b><span>${esc(s.l)}</span></div>`).join('')}</div></div>`:''}
${S.tests.length?`<div class="sc" id="t"><small>${L.tm.toUpperCase()}</small><h2>${L.rev}</h2><div class="g3">${S.tests.map(t=>`<div class="tm"><p>“${esc(t.t)}”</p><b>${esc(t.n)}</b>${t.u?`<br>${lk(t.u,L.watch+' →')}`:''}</div>`).join('')}</div></div>`:''}
